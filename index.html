<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <section class="todo-card">
        <header class="header">
          <p class="eyebrow">Daily planner</p>
          <h1>To-Do List</h1>
        </header>

        <form id="todo-form" class="todo-form" autocomplete="off">
          <label class="sr-only" for="todo-input">Add a new task</label>
          <input
            id="todo-input"
            type="text"
            name="task"
            placeholder="Add a new task..."
            maxlength="120"
            required
          />
          <button type="submit">Add</button>
        </form>

        <div class="toolbar">
          <div class="filter-group" aria-label="Filter tasks">
            <button class="filter-btn active" type="button" data-filter="all">All</button>
            <button class="filter-btn" type="button" data-filter="active">Active</button>
            <button class="filter-btn" type="button" data-filter="completed">Completed</button>
          </div>
          <button id="clear-completed" class="secondary-btn" type="button">Clear completed</button>
        </div>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

        <footer class="summary">
          <span id="items-left">0 items left</span>
        </footer>
      </section>
    </main>

    <template id="todo-item-template">
      <li class="todo-item">
        <label class="todo-check">
          <input type="checkbox" />
          <span class="checkmark" aria-hidden="true"></span>
        </label>
        <span class="todo-text"></span>
        <button class="delete-btn" type="button" aria-label="Delete task">Delete</button>
      </li>
    </template>

    <script src="script.js"></script>
  </body>
</html>
